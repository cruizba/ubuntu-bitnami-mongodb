name: Build and push Docker image

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  MONGODB_MAJOR_MINOR: '8.0'
  MONGODB_VERSION: '8.0.19'
  BUILD_NUMBER: 1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local only)
        uses: docker/build-push-action@v6
        with:
          load: true
          file: Dockerfile
          tags: cruizba/ubuntu-bitnami-mongodb:test

      - name: Install BATS
        run: |
          sudo apt-get update && sudo apt-get install -y bats
          # Install bats helpers
          sudo mkdir -p /usr/lib/bats
          sudo git clone --depth 1 https://github.com/bats-core/bats-support.git /usr/lib/bats/bats-support
          sudo git clone --depth 1 https://github.com/bats-core/bats-assert.git /usr/lib/bats/bats-assert

      - name: Run tests
        env:
          MONGODB_IMAGE: cruizba/ubuntu-bitnami-mongodb:test
        run: tests/run-tests.sh

      - name: Dump container logs on failure
        if: failure()
        run: |
          echo "=== Docker containers ==="
          docker ps -a
          echo ""
          for project in $(docker compose ls -q 2>/dev/null); do
            echo "=== Logs for project: ${project} ==="
            docker compose -p "$project" logs 2>&1 || true
          done

  push:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: cruizba
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push standalone image
        uses: docker/build-push-action@v6
        with:
          push: true
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: |
            cruizba/ubuntu-bitnami-mongodb:${{ env.MONGODB_MAJOR_MINOR }}
            cruizba/ubuntu-bitnami-mongodb:${{ env.MONGODB_VERSION }}
            cruizba/ubuntu-bitnami-mongodb:${{ env.MONGODB_VERSION }}-r${{ env.BUILD_NUMBER }}
            cruizba/ubuntu-bitnami-mongodb:latest